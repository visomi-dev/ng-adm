<!doctype html>
<html [attr.lang]="page().locale">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- SEO Meta Tags -->
    <title>{{ pageTitle() }}</title>
    @if (pageDescription()) {
      <meta name="description" [attr.content]="pageDescription()" />
    }
    @if (canonicalUrl()) {
      <link rel="canonical" [attr.href]="canonicalUrl()" />
    }

    <!-- Open Graph Meta Tags -->
    @if (ogImage()) {
      <meta property="og:image" [attr.content]="ogImage()" />
    }
    @if (ogUrl()) {
      <meta property="og:url" [attr.content]="ogUrl()" />
    }
    @if (ogType()) {
      <meta property="og:type" [attr.content]="ogType()" />
    }
    <meta property="og:title" [attr.content]="pageTitle()" />
    @if (pageDescription()) {
      <meta property="og:description" [attr.content]="pageDescription()" />
    }
  </head>
  <body>
    <main class="page-content">
      @for (node of rootNodes(); track node.id) {
        <lib-node-renderer [node]="node" />
      }
    </main>
  </body>
</html>
