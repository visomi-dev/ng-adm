<section
  class="relative flex flex-col items-center justify-center text-center text-white"
  [class]="classComputed()"
  [style]="styleComputed()"
>
  <div class="absolute inset-0 bg-black opacity-40"></div>

  <div class="relative z-10 flex items-center justify-center">
    @if (leftImage()) {
      <img
        [src]="leftImage()"
        [alt]="leftImageAlt()"
        class="mr-8 h-auto w-32"
      />
    }

    <div class="flex flex-col">
      @if (title()) {
        <h1 class="text-4xl font-bold">
          {{ title() }}
        </h1>
      }

      @if (description()) {
        <p class="mt-4 text-lg">
          {{ description() }}
        </p>
      }

      @if (callToActionText() && callToActionTo()) {
        <div class="mt-8">
          <p-button
            [label]="callToActionText()"
            [routerLink]="callToActionTo()"
            styleClass="p-button-lg"
          />
        </div>
      }
    </div>

    @if (rightImage()) {
      <img
        [src]="rightImage()"
        [alt]="rightImageAlt()"
        class="ml-8 h-auto w-32"
      />
    }
  </div>
</section>
