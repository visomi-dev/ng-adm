<nav class="flex" [class]="classComputed()">
  <ng-content />
</nav>

<button
  (click)="toggleMobileMenu()"
  class="text-[var(--page-header-nav-item-text)] focus:outline-none md:hidden"
  aria-label="Toggle menu"
  i18n-aria-label="@@toggleMenu.ariaLabel"
  [attr.aria-expanded]="mobileMenuOpen()"
>
  <svg
    class="h-[var(--page-header-nav-item-size)] w-[var(--page-header-nav-item-size)]"
    fill="none"
    stroke="currentColor"
    viewBox="0 0 24 24"
    xmlns="http://www.w3.org/2000/svg"
  >
    @if (mobileMenuOpen()) {
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="2"
        d="M6 18L18 6M6 6l12 12"
      />
    } @else {
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="2"
        d="M4 6h16M4 12h16m-7 6h7"
      />
    }
  </svg>
</button>
